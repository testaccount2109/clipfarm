name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Clipfarm installer
        run: npm run build:win

      - name: Build standalone updater
        run: npm run build:updater

      - name: Create installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Tag $env:GITHUB_REF_NAME must match package version $expectedTag" }
          $installer = "release/clipfarm-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME `
            "release/clipfarm-Setup-$version.exe" `
            "release/clipfarm-Setup-$version.exe.sha256" `
            "release/Clipfarm-Updater.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Clipfarm $env:GITHUB_REF_NAME" `
            --generate-notes `
            --latest
