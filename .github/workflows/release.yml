name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Clipfarm installer
        run: npm run build:win

      - name: Build unpacked Clipfarm update files
        run: npm run pack:update

      - name: Create release archives and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Tag $env:GITHUB_REF_NAME must match package version $expectedTag" }
          $installer = "release/clipfarm-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

          $unpacked = "release-update/win-unpacked"
          if (-not (Test-Path -LiteralPath "$unpacked/clipfarm.exe")) { throw "Unpacked Clipfarm app missing: $unpacked" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $appArchive = "release/clipfarm-App-$version.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $unpacked).Path, $appArchive, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash -LiteralPath $appArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $appArchive)" | Set-Content -LiteralPath "$appArchive.sha256" -Encoding ascii

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME `
            "release/clipfarm-Setup-$version.exe" `
            "release/clipfarm-Setup-$version.exe.sha256" `
            "release/clipfarm-App-$version.zip" `
            "release/clipfarm-App-$version.zip.sha256" `
            "release/Clipfarm-Updater.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Clipfarm $env:GITHUB_REF_NAME" `
            --generate-notes `
            --latest
